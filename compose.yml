name: ibkr-paper

services:
  # Docker creates the settings volume as root, but Gateway runs as user 1000.
  fix-settings-permissions:
    image: alpine:3.20
    user: "0"
    command: chown -R 1000:1000 /settings
    volumes:
      - gateway-settings:/settings
    restart: "no"

  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:10.50.1f
    restart: unless-stopped
    depends_on:
      fix-settings-permissions:
        condition: service_completed_successfully

    environment:
      TWS_USERID: ${TWS_USERID:?Set TWS_USERID in .env}
      TWS_PASSWORD_FILE: /run/secrets/tws_password
      VNC_SERVER_PASSWORD_FILE: /run/secrets/vnc_password

      TRADING_MODE: paper
      READ_ONLY_API: ${READ_ONLY_API:-no}
      TWS_ACCEPT_INCOMING: accept
      ALLOW_BLIND_TRADING: "no"

      TIME_ZONE: America/New_York
      AUTO_RESTART_TIME: "11:59 PM"
      TWOFA_TIMEOUT_ACTION: restart
      RELOGIN_AFTER_TWOFA_TIMEOUT: "yes"

      TWS_SETTINGS_PATH: /home/ibgateway/tws_settings

    secrets:
      - tws_password
      - vnc_password

    volumes:
      - gateway-settings:/home/ibgateway/tws_settings

    ports:
      - "127.0.0.1:4002:4004"
      - "127.0.0.1:5900:5900"

    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

secrets:
  tws_password:
    file: ./secrets/tws_password.txt
  vnc_password:
    file: ./secrets/vnc_password.txt

volumes:
  gateway-settings:
